apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../../config/dev

replicas:
- count: 2
  name: kueue-controller-manager

patches:
- path: manager_e2e_patch.yaml
  target:
    group: apps
    kind: Deployment
    name: kueue-controller-manager
    namespace: kueue-system
    version: v1

configMapGenerator:
- behavior: merge
  files:
  - controller_manager_config.yaml
  name: kueue-manager-config
  namespace: kueue-system
- literals:
  - namespace=${KUEUE_NAMESPACE}
  name: kueue-namespace


replacements:
- source:
    fieldPath: data.namespace
    kind: ConfigMap
    name: kueue-namespace
  targets:
  - fieldPaths:
    - subjects.0.namespace
    select:
      kind: RoleBinding
      name: visibility-server-auth-reader
